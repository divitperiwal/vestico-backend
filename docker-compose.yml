
services:
  backend:
    build: .
    container_name: vexit_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name : vexit_redis
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
    

  
